# Daily price collection on GitHub's free runners (free and unlimited for public repos).
# Writes to the Neon database in the DATABASE_URL repository secret. docs/DEPLOY.md.
name: collect

on:
  # Every brand's catalog is collected in two halves, so the largest (DeFacto, ~14.6k pages, ~5 h at
  # 1 request/s) stays well inside GitHub's 6 h job limit. Every product is still seen once a day.
  # Brands run in parallel (different sites, each at its own polite rate).
  # GitHub may start scheduled runs some minutes late.
  schedule:
    - cron: "0 0 * * *" # 03:00 Turkey time: shard 0/2
    - cron: "0 12 * * *" # 15:00 Turkey time: shard 1/2
  workflow_dispatch:
    inputs:
      brand:
        description: Collector slug
        default: defacto
        required: true
      limit:
        description: Stop after this many items (empty = whole shard)
        default: ""
        required: false
      shard:
        description: Part of the catalog, e.g. 0/2 (0/1 = everything)
        default: "0/1"
        required: true

jobs:
  # Once, before any brand starts, so parallel brand jobs never race on a schema change.
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: migrate
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
      - name: Install
        run: uv sync --frozen --no-dev
      - name: Check the secret is set
        run: test -n "$DATABASE_URL" || { echo "::error::Repository secret DATABASE_URL is missing"; exit 1; }
      - name: Migrate
        run: uv run alembic upgrade head

  collect:
    needs: migrate
    strategy:
      fail-fast: false
      matrix:
        # Scheduled runs collect every brand; a manual run only the one asked for.
        brand: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.brand)) || fromJSON('["defacto", "colins"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330 # GitHub's hard limit is 6 h; half of DeFacto is ~2.5-3 h, of Colin's ~1 h
    concurrency:
      group: collect-${{ matrix.brand }}
      cancel-in-progress: false # never two runs of the same brand at once
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      COLLECTOR_USER_AGENT: realdrop-bot/0.1 (+https://github.com/AhmedElghazzawy/realdrop)
      APP_ENV: production
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
      - name: Install
        run: uv sync --frozen --no-dev
      - name: Collect
        env: # inputs go through env, never straight into the script (no shell injection)
          BRAND: ${{ matrix.brand }}
          LIMIT: ${{ inputs.limit }}
          SHARD: ${{ github.event_name == 'schedule' && (github.event.schedule == '0 0 * * *' && '0/2' || '1/2') || inputs.shard }}
        run: uv run python -m realdrop.collectors.run --brand "$BRAND" --shard "$SHARD" ${LIMIT:+--limit "$LIMIT"}
